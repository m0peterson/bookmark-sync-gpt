services:
  - type: web
    name: orbit-tabs-api
    runtime: node
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-tabs-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: orbit-tabs-db
    databaseName: orbit_tabs
    user: orbit_tabs
